###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
 $mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,   # moved off Super+V (Super+V is now clipboard); Super+T toggles float
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Centered master layout controls (25/50/25)
bind = $mainMod, O, layoutmsg, orientationcenter      # force centered master on this workspace
bind = $mainMod SHIFT, O, layoutmsg, orientationnext   # cycle left/top/right/bottom/center
bind = $mainMod, bracketleft,  layoutmsg, mfact -0.05  # shrink the center pane
bind = $mainMod, bracketright, layoutmsg, mfact +0.05  # grow the center pane
bind = $mainMod CTRL, M, layoutmsg, mfact exact 0.5    # snap the center pane back to 50%

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Programs
bind = $mainMod, L, exec, wofi --sort-order=alphabetical
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# --- GLOBAL WORKSPACE BINDINGS ---
# This ensures workspaces 2, 4, and 5 are explicitly bound to DP-1.
# This often fixes "apps spawning on wrong monitor" issues.
workspace = 2, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Example windowrule
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$ 

# --- SPECIFIC APPLICATION RULES (PLACED FIRST) ---
# Rules are processed in order. We must move the window BEFORE we apply the global maximize.

#Discord (Title Match + Class Match)
# Using 'title' catches the window even if the class is unstable due to child processes.# Discord# 1. GLOBAL RULES: Exclude Discord and Spotify from Maximize
# This prevents them from locking onto Workspace 1 on startup.
# This regex matches any class that is NOT "discord" or "Spotify".
# 2. APP SPECIFIC RULES: Use initialClass (more reliable for spawn)
windowrule {
  name = windowrule-1
  maximize = on
  match:class = (?i)^(?!discord|spotify).*$
}

windowrule {
  name = windowrule-2
  workspace = 4
  maximize = on
  match:class = (?i)^discord$
}

windowrule {
  name = windowrule-3
  workspace = 4
  maximize = on
  match:class = (?i)^spotify$
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-4
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


debug {
    disable_logs = false
}


exec-once = hyprpm reload -n

# export Wayland session to systemd so xdg-desktop-portal works (screen share, file pickers)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 2>/dev/null
exec-once = ghostty 
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 4 silent] discord
exec-once = [workspace 4 silent] spotify-launcher
exec-once = hyprpaper
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data


exec-once = mako   # notification daemon (for update alerts)
