# App workspace rules (sourced by hyprland.conf).
# NOTE: windowrule blocks don't support `monitor =`; workspaces are already
# bound to monitors via `workspace = N, monitor:DP-1` in hyprland.conf.

# Browser
windowrule {
  name = browser-workspace
  workspace = 2
  match:class = ^(zen-browser)$
}

# Music (TUI player)
windowrule {
  name = music-workspace
  workspace = 5
  match:class = ^(spotify-player)$
}

# Discord (webcord)
windowrule {
  name = discord-workspace
  workspace = 4
  match:class = ^(webcord)$
}
