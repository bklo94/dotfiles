set-option -g prefix C-s
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
# auto-compact window numbers when a window closes (prefix-m still forces manually)
set-option -g renumber-windows on

bind m move-window -r

# auto-renumber numbered sessions when one closes — tmux has no native option.
# The logic must live in a file: tmux.conf expands $VAR/${VAR} in every config
# line, so shell variables cannot survive inline here.
# Regression test: ~/.tmux.conf.d/test-renumber.sh
set-hook -g session-closed 'run-shell -b ~/.tmux.conf.d/renumber-sessions.sh'

set-option -g mouse on 

set-option -g history-limit 256000

set-option -g set-titles on 
set-option -g set-titles-string "#{pane_title}"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -s focus-events on 
set-option -s extended-keys on 

set-option -s escape-time 0 

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jonmosco/kube-tmux'

# bash wrapper REQUIRED on Debian-family: nord.tmux has no shebang and uses
# ${BASH_SOURCE[0]} — tmux run-shell goes through /bin/sh (dash on bookworm),
# where BASH_SOURCE is unset and the theme dies silently (rc=0, no colors).
run-shell 'bash ~/.tmux/themes/nord-tmux/nord.tmux'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
